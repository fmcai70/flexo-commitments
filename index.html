<!doctype html>
<html lang="en" data-version="7">
<head>
<meta charset="utf-8">
<script>
// ActionRegister moved to https://flexo.com.ph/actionregister/ (2026-10-21). The old GitHub Pages address forwards
// there, keeping the page and the #... part, so sign-in and password-reset links sent before the move still work.
if (location.hostname === 'fmcai70.github.io') {
  location.replace('https://flexo.com.ph/actionregister/' + location.pathname.replace(/^\/flexo-commitments\/?/, '') + location.search + location.hash);
}
</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1C3F73">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ActionRegister">
<meta name="description" content="Flexo's register of commitments and actions: plans, deadlines, check-ins and extension requests.">
<title>ActionRegister</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png?v=2">
<link rel="icon" type="image/svg+xml" href="img/favicon.svg?v=2">
<link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/commitments.css?v=4">
<link rel="stylesheet" href="css/app.css?v=4">
</head>
<body>
<div class="ar-loading" id="loadingScreen">Loading…</div>

<!-- Sign-in (shared Flexo accounts) -->
<main class="ar-auth" id="authScreen" hidden>
  <div class="ar-card">
    <h1>ActionRegister</h1>
    <p class="ar-sub" id="authSub">Sign in with your Flexo account</p>

    <form id="signInForm">
      <label>Email <input type="email" id="authEmail" autocomplete="username" required></label>
      <label>Password <input type="password" id="authPassword" autocomplete="current-password"></label>
      <button class="btn ar-block" type="submit">Sign in</button>
      <button class="btn ghost ar-block" type="button" id="magicLinkBtn">Email me a sign-in link instead</button>
      <button class="ar-link" type="button" id="forgotBtn">Forgot password?</button>
    </form>

    <form id="newPasswordForm" hidden>
      <label>New password <input type="password" id="newPassword" minlength="8" autocomplete="new-password" required></label>
      <button class="btn ar-block" type="submit">Save new password</button>
    </form>

    <div id="blockedBox" hidden>
      <p id="blockedText" class="ar-blocked"></p>
      <a class="btn ghost ar-block" id="portalLink" href="#">Open the Flexo Portal</a>
      <button class="btn ghost ar-block" type="button" id="blockedSignOut">Sign out</button>
    </div>

    <p class="ar-error" id="authError" role="alert"></p>
    <p class="ar-info" id="authInfo" role="status"></p>
  </div>
</main>

<!-- The app (screens drawn by js/commitments.js) -->
<div id="appShell" hidden>
<div class="wrap">
  <header class="top">
    <div class="bar">
      <div class="brand">
        <svg class="reg" viewBox="0 0 26 26" aria-hidden="true"><circle cx="13" cy="13" r="8" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="13" cy="13" r="3" fill="currentColor"/><path d="M13 1v24M1 13h24" stroke="currentColor" stroke-width="1.6"/></svg>
        ActionRegister
      </div>
      <span id="live" class="live connecting" role="status" aria-live="polite"><i></i>Connecting…</span>
      <label class="who"><span class="who-l">Viewing as</span>
        <select id="me" aria-label="Viewing as"></select>
      </label>
    </div>
    <div class="cmyk" aria-hidden="true"><i style="background:var(--c)"></i><i style="background:var(--m)"></i><i style="background:var(--y)"></i><i style="background:var(--k)"></i></div>
    <nav class="tabs" id="tabs" role="tablist"></nav>
  </header>
  <main id="main"></main>
</div>
</div>

<!-- Account: password and sign out -->
<dialog id="accountDialog" class="ar-dialog">
  <form method="dialog" id="accountForm">
    <h2>Your account</h2>
    <p class="ar-meta" id="accountEmail"></p>
    <label>New password <input type="password" id="accountPassword" minlength="8" autocomplete="new-password"></label>
    <label>Repeat new password <input type="password" id="accountPassword2" minlength="8" autocomplete="new-password"></label>
    <p class="ar-meta">At least 8 characters. It's the same password for every Flexo app. Leave both empty to keep it.</p>
    <p class="ar-error" id="accountError" role="alert"></p>
    <div class="ar-actions">
      <button class="btn ghost" type="button" id="accountSignOut">Sign out</button>
      <span class="ar-spacer"></span>
      <button class="btn ghost" value="cancel" formnovalidate>Cancel</button>
      <button class="btn" value="save" id="accountSave">Save</button>
    </div>
  </form>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<!-- Served from this site (not a CDN) so sign-in also works on networks that block CDNs. -->
<script src="vendor/supabase-js-2.117.3.min.js"></script>
<script src="config.js?v=1"></script>
<script src="js/cloud.js?v=3"></script>
</body>
</html>
